<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, Monaco, monospace; }
    </style>
    <symbol id="logo" viewBox="0 0 32 32">
      <path d="M10 20C8.34315 20 7 18.6569 7 17C7 15.4806 8.1307 14.2254 9.60144 14.0305C9.53483 13.6963 9.5 13.3522 9.5 13C9.5 10.5147 11.5147 8.5 14 8.5C15.9084 8.5 17.5357 9.68913 18.1729 11.3653C18.6791 11.1298 19.2435 11 19.8333 11C21.7663 11 23.3333 12.567 23.3333 14.5C23.3333 14.6644 23.322 14.8262 23.3 14.9845C24.3142 15.429 25 16.4382 25 17.6C25 19.2569 23.6569 20.6 22 20.6H10.5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 20L16 17.5L18 20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 18V23.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="627" fill="#000000"/>

  <!-- Left column -->
  <rect x="64" y="64" width="44" height="44" rx="11" fill="#111111" stroke="#262626"/>
  <use xlink:href="#logo" x="68" y="68" width="36" height="36"/>
  <text x="122" y="95" class="sans" font-size="26" font-weight="600" fill="#EDEDED">SmallCloud</text>

  <text x="64" y="212" class="sans" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Your team should</text>
  <text x="64" y="272" class="sans" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="-1">ship features, not</text>
  <text x="64" y="332" class="sans" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="-1">babysit servers.</text>

  <text x="64" y="398" class="sans" font-size="25" fill="#8A8A8A">Connect GitHub, pick a repo, and get</text>
  <text x="64" y="434" class="sans" font-size="25" fill="#8A8A8A">a live HTTPS URL. We run the infra.</text>

  <rect x="64" y="490" width="300" height="64" rx="12" fill="#0066FF"/>
  <text x="214" y="530" class="sans" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start deploying free</text>
  <text x="390" y="530" class="mono" font-size="20" fill="#5C5C5C">smallcloud.si</text>

  <!-- Right: deploy panel -->
  <rect x="620" y="64" width="516" height="499" rx="18" fill="#0A0A0A" stroke="#1F1F1F" stroke-width="2"/>
  <text x="650" y="101" class="sans" font-size="22" font-weight="600" fill="#EDEDED">Deploy application</text>
  <rect x="1008" y="80" width="106" height="30" rx="15" fill="#0B1A33" stroke="#003E99"/>
  <text x="1061" y="100" class="mono" font-size="15" fill="#3691FB" text-anchor="middle">Production</text>
  <line x1="620" y1="124" x2="1136" y2="124" stroke="#1F1F1F" stroke-width="2"/>

  <text x="650" y="160" class="mono" font-size="14" fill="#5C5C5C" letter-spacing="1.5">REPOSITORY</text>
  <text x="650" y="188" class="mono" font-size="19"><tspan fill="#10B981">✓ </tspan><tspan fill="#EDEDED">github.com/acme/store</tspan></text>
  <text x="650" y="228" class="mono" font-size="14" fill="#5C5C5C" letter-spacing="1.5">BRANCH</text>
  <text x="650" y="256" class="mono" font-size="19" fill="#EDEDED">main</text>
  <text x="650" y="296" class="mono" font-size="14" fill="#5C5C5C" letter-spacing="1.5">FRAMEWORK</text>
  <text x="650" y="324" class="mono" font-size="19" fill="#EDEDED">Next.js detected</text>

  <line x1="650" y1="350" x2="1106" y2="350" stroke="#1F1F1F" stroke-width="2"/>

  <text x="650" y="384" class="mono" font-size="14" fill="#5C5C5C" letter-spacing="1.5">DEPLOYMENT STATUS</text>
  <text x="650" y="416" class="sans" font-size="19"><tspan fill="#10B981">✓ </tspan><tspan fill="#B5B5B5">Repository connected</tspan></text>
  <text x="650" y="448" class="sans" font-size="19"><tspan fill="#10B981">✓ </tspan><tspan fill="#B5B5B5">Build completed</tspan></text>
  <text x="650" y="480" class="sans" font-size="19"><tspan fill="#10B981">✓ </tspan><tspan fill="#B5B5B5">Application deployed</tspan></text>

  <rect x="640" y="500" width="476" height="46" rx="10" fill="#06140D" stroke="#0F3D27" stroke-width="2"/>
  <text x="660" y="530" class="mono" font-size="18"><tspan fill="#10B981" font-weight="600">● Live  </tspan><tspan fill="#3691FB" font-weight="600">https://store.smallcloud.si</tspan></text>
</svg>
